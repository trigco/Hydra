name: Slipstream Android arm64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/slipstream-arm64.yml"
      - "native/slipstream/**"

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Hydra
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build meson pkg-config perl git

      - name: Set up Java and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
      - name: Install pinned NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Checkout pinned Slipstream source
        run: |
          git clone https://github.com/EndPositive/slipstream.git native/slipstream
          git -C native/slipstream checkout e158a681f1cc5cb000a92274371e67237d2a6493
          git -C native/slipstream submodule update --init --recursive

      - name: Build OpenSSL for Android arm64
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          git clone --depth 1 --branch openssl-3.3.2 https://github.com/openssl/openssl.git native/openssl
          cd native/openssl
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          ./Configure android-arm64 -D__ANDROID_API__=23 no-shared no-tests --prefix="$GITHUB_WORKSPACE/native/openssl-install"
          make -j"$(nproc)"
          make install_sw

      - name: Configure Android cross toolchain
        run: |
          set -euxo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/build/cmake/android.toolchain.cmake"
          cat > "$GITHUB_WORKSPACE/native/android-arm64-toolchain.cmake" <<EOF
          set(CMAKE_SYSTEM_NAME Android)
          set(CMAKE_SYSTEM_VERSION 23)
          set(CMAKE_ANDROID_ARCH_ABI arm64-v8a)
          set(CMAKE_ANDROID_NDK "$NDK")
          set(CMAKE_ANDROID_STL_TYPE c++_shared)
          include("$TOOLCHAIN")
          EOF
          mkdir -p "$GITHUB_WORKSPACE/native"
          cat > "$GITHUB_WORKSPACE/native/arm64.ini" <<EOF
          [binaries]
          c = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang'
          cpp = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang++'
          ar = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          cmake_toolchain_file = '$GITHUB_WORKSPACE/native/android-arm64-toolchain.cmake'
          cmake_defaults = false
          EOF

      - name: Cross-compile Slipstream client and server
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/native/openssl-install/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/native/openssl-install/lib/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: ${{ github.workspace }}/native/openssl-install
        run: |
          set -euxo pipefail
          cd native/slipstream
          meson setup build-arm64 --cross-file "$GITHUB_WORKSPACE/native/arm64.ini" --buildtype=release -Db_lto=true --warnlevel=0 -Ddefault_library=static
          meson compile -C build-arm64
          file build-arm64/slipstream-client build-arm64/slipstream-server
          llvm-readelf -h build-arm64/slipstream-client | grep -E 'Class:|Machine:'

      - name: Stage native executables
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets/slipstream/arm64-v8a
          install -m 0755 native/slipstream/build-arm64/slipstream-client app/src/main/assets/slipstream/arm64-v8a/slipstream-client
          install -m 0755 native/slipstream/build-arm64/slipstream-server app/src/main/assets/slipstream/arm64-v8a/slipstream-server
          sha256sum app/src/main/assets/slipstream/arm64-v8a/*

      - name: Upload arm64 native build
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-android-arm64
          path: app/src/main/assets/slipstream/arm64-v8a/
          if-no-files-found: error
          retention-days: 14
